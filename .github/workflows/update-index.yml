name: Update Day Index

on:
  push:
    branches: 
      - main
    paths:
      - 'day-*.md'
      
concurrency:
  group: update-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate README index and days.json
        run: python scripts/update_index.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md days.json
          git diff --cached --quiet || git commit -m "chore: update day index [skip ci]"
          git push

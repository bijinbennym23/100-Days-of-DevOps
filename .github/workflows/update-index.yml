name: Update Day Index

on:
  push:
    branches: [main]
    paths:
      - 'days/**'

permissions:
  contents: write

jobs:
  auto-commit-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2
        with:
          python-version: "3.12"
      - run: python scripts/generate_index.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md days.json
          git diff --cached --quiet || git commit -m "chore: update day index [skip ci]"
          git push
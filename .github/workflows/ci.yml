name: CI
on:
  pull_request:
  push:
    branches: 
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/update_index.py
      - run: python -c "import json; json.load(open('days.json'))"